<!doctype html>
<html lang="es">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horario INEM 11-08</title>

    <style>
      :root {
        --bg-primary: #0f172a;
        --bg-card: #1e293b;
        --bg-hover: #334155;
        --text-main: #f8fafc;
        --text-sub: #94a3b8;
        --accent: #38bdf8;
        --border: #334155;
        --live-badge: #ef4444;
        --card-live-bg: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        --card-live-border: #38bdf8;
      }

      .light-theme {
        --bg-primary: #f1f5f9;
        --bg-card: #ffffff;
        --bg-hover: #e2e8f0;
        --text-main: #0f172a;
        --text-sub: #64748b;
        --accent: #0284c7;
        --border: #cbd5e1;
        --live-badge: #dc2626;
        --card-live-bg: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
        --card-live-border: #0284c7;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      body {
        background-color: var(--bg-primary);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 12px;
        transition:
          background-color 0.3s,
          color 0.3s;
      }

      .app-container {
        width: 100%;
        max-width: 480px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding-bottom: 30px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--bg-card);
        padding: 14px 16px;
        border-radius: 16px;
        border: 1px solid var(--border);
      }

      .theme-toggle-btn {
        background: none;
        border: none;
        font-size: 1.2rem;
        cursor: pointer;
        color: var(--text-main);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* TARJETA DE ESTADO EN VIVO EN LA PARTE SUPERIOR */
      .live-status-card {
        background: var(--card-live-bg);
        border: 2px solid var(--card-live-border);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        gap: 10px;
        position: relative;
        overflow: hidden;
      }

      .live-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .live-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(239, 68, 68, 0.15);
        color: var(--live-badge);
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .live-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--live-badge);
        animation: blink 1.2s infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.3;
          transform: scale(0.85);
        }
      }

      .live-class-title {
        font-size: 1.35rem;
        font-weight: 800;
        color: var(--text-main);
        line-height: 1.2;
      }

      .live-time-info {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-top: 4px;
      }

      .time-countdown {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--accent);
      }

      .time-end-at {
        font-size: 0.82rem;
        color: var(--text-sub);
      }

      .progress-bar-container {
        width: 100%;
        height: 6px;
        background: var(--bg-hover);
        border-radius: 3px;
        overflow: hidden;
        margin-top: 2px;
      }

      .progress-bar-fill {
        height: 100%;
        background: var(--accent);
        width: 0%;
        transition: width 0.5s ease;
      }

      .days-nav {
        display: flex;
        gap: 6px;
        background: var(--bg-card);
        padding: 6px;
        border-radius: 14px;
        border: 1px solid var(--border);
      }

      .day-btn {
        flex: 1;
        padding: 10px 0;
        border: none;
        background: transparent;
        color: var(--text-sub);
        font-weight: 600;
        font-size: 0.85rem;
        border-radius: 10px;
        cursor: pointer;
        text-align: center;
      }

      .day-btn.active {
        background: var(--accent);
        color: #ffffff;
      }

      .actions-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .timeline {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .time-slot {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .time-slot.clickable-card {
        cursor: pointer;
        transition:
          transform 0.15s ease,
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      .time-slot.clickable-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
      }

      .time-slot.active-now {
        border: 2px solid var(--accent);
        background: linear-gradient(
          to right,
          rgba(56, 189, 248, 0.08),
          transparent
        );
      }

      .slot-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.8rem;
        color: var(--text-sub);
        font-weight: 600;
      }

      .class-card {
        border-left: 4px solid var(--accent);
        padding-left: 10px;
        margin-top: 2px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .class-title {
        font-size: 1rem;
        font-weight: 700;
      }

      .enter-class-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 4px;
        background: var(--accent);
        color: #ffffff;
        border: none;
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 700;
        width: 100%;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }

      .class-links {
        display: flex;
        gap: 8px;
      }

      .class-links .enter-class-btn {
        flex: 1;
        padding: 10px 8px;
      }

      .enter-class-btn.alternate-link-btn {
        background: transparent;
        border: 1px solid var(--accent);
        color: var(--accent);
        box-shadow: none;
      }

      .enter-class-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .empty-slot {
        font-size: 0.85rem;
        color: var(--text-sub);
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <header>
        <div>
          <h1 style="font-size: 1.1rem">INEM - Grupo 11-08</h1>
          <div
            style="font-size: 0.75rem; color: var(--text-sub)"
            id="clockDisplay"
          >
            Viernes, 23:12:34
          </div>
        </div>
        <div class="header-actions">
          <button
            class="theme-toggle-btn"
            id="themeToggleBtn"
            aria-label="Cambiar tema"
          >
            🌙
          </button>
        </div>
      </header>

      <!-- TARJETA DESTACADA EN LA PARTE SUPERIOR -->
      <div class="live-status-card" id="liveCard">
        <div class="live-card-header">
          <div class="live-tag">
            <div class="live-dot"></div>
            <span id="liveTagText">JORNADA FINALIZADA</span>
          </div>
          <div class="time-end-at" id="liveEndText"></div>
        </div>

        <div class="live-class-title" id="liveClassTitle">
          ¡Has terminado por hoy!
        </div>

        <div class="live-time-info">
          <div class="time-countdown" id="liveCountdown">Nos vemos mañana</div>
        </div>

        <div class="progress-bar-container">
          <div
            class="progress-bar-fill"
            id="progressBarFill"
            style="width: 100%"
          ></div>
        </div>
      </div>

      <nav class="days-nav">
        <button class="day-btn active" data-day="1">Lun</button>
        <button class="day-btn" data-day="2">Mar</button>
        <button class="day-btn" data-day="3">Mié</button>
        <button class="day-btn" data-day="4">Jue</button>
        <button class="day-btn" data-day="5">Vie</button>
      </nav>

      <div class="actions-bar">
        <div style="font-size: 0.95rem; font-weight: 700" id="selectedDayTitle">
          Horario del Lunes
        </div>
      </div>

      <div class="timeline" id="timeline">
        <div class="time-slot clickable-card">
          <div class="slot-header">
            <span>1.ª Hora a 2.ª Hora (07:00 - 08:50)</span>
          </div>
          <div class="class-card">
            <div class="class-title">Filosofía</div>
            <button class="enter-class-btn">💻 Entrar a Clase Virtual</button>
          </div>
        </div>
        <div class="time-slot clickable-card">
          <div class="slot-header">
            <span>3.ª Hora a 4.ª Hora (08:50 - 11:10)</span>
          </div>
          <div class="class-card">
            <div class="class-title">Inglés</div>
            <button class="enter-class-btn">💻 Entrar a Clase Virtual</button>
          </div>
        </div>
        <div class="time-slot clickable-card">
          <div class="slot-header">
            <span>5.ª Hora a 6.ª Hora (11:10 - 13:00)</span>
          </div>
          <div class="class-card">
            <div class="class-title">Ciencias Económicas</div>
            <button class="enter-class-btn">💻 Entrar a Clase Virtual</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const BASE_SCHEDULE_SLOTS = [
        {
          id: 1,
          label: "1.ª Hora",
          start: "07:00",
          end: "07:55",
          startMin: 7 * 60,
          endMin: 7 * 60 + 55,
        },
        {
          id: 2,
          label: "2.ª Hora",
          start: "07:55",
          end: "08:50",
          startMin: 7 * 60 + 55,
          endMin: 8 * 60 + 50,
        },
        {
          id: 3,
          label: "3.ª Hora",
          start: "08:50",
          end: "09:45",
          startMin: 8 * 60 + 50,
          endMin: 9 * 60 + 45,
        },
        {
          id: 4,
          label: "4.ª Hora",
          start: "10:15",
          end: "11:10",
          startMin: 10 * 60 + 15,
          endMin: 11 * 60 + 10,
        },
        {
          id: 5,
          label: "5.ª Hora",
          start: "11:10",
          end: "12:05",
          startMin: 11 * 60 + 10,
          endMin: 12 * 60 + 5,
        },
        {
          id: 6,
          label: "6.ª Hora",
          start: "12:05",
          end: "13:00",
          startMin: 12 * 60 + 5,
          endMin: 13 * 60,
        },
      ];

      function getScheduleSlotsForDay(day) {
        return BASE_SCHEDULE_SLOTS;
      }

      const classList = [
        // LUNES
        {
          day: 1,
          startSlot: 1,
          endSlot: 2,
          name: "Filosofía",
          link: "https://meet.google.com/qco-ioyr-ida",
        },
        {
          day: 1,
          startSlot: 3,
          endSlot: 4,
          name: "Inglés",
          link: "https://meet.google.com/xmi-ghkx-vpr",
        },
        {
          day: 1,
          startSlot: 5,
          endSlot: 6,
          name: "Ciencias Económicas",
          link: "https://meet.google.com/urg-duxf-nrh",
        },

        // MARTES
        {
          day: 2,
          startSlot: 1,
          endSlot: 1,
          name: "Tecnología e Informática",
          link: "https://meet.google.com/qww-tsux-gvn",
        },
        {
          day: 2,
          startSlot: 2,
          endSlot: 3,
          name: "Química",
          link: "https://meet.google.com/uhv-avug-zzd",
        },
        {
          day: 2,
          startSlot: 4,
          endSlot: 4,
          name: "Educacion Fisica",
          link: "https://meet.google.com/anj-thus-pzc",
        },
        {
          day: 2,
          startSlot: 5,
          endSlot: 6,
          name: "Física",
          link: "https://meet.google.com/xcc-tzfm-keb",
        },

        // MIÉRCOLES
        {
          day: 3,
          startSlot: 1,
          endSlot: 1,
          name: "Física",
          link: "https://meet.google.com/xcc-tzfm-keb",
        },
        {
          day: 3,
          startSlot: 2,
          endSlot: 2,
          name: "Educación Religiosa",
          link: "https://meet.google.com/efd-vhwp-xfi",
        },
        {
          day: 3,
          startSlot: 3,
          endSlot: 4,
          name: "Lengua Castellana",
          link: "https://meet.google.com/wah-hoig-xhx",
          alternateLink: "https://meet.google.com/iec-uvas-vnx",
        },
        {
          day: 3,
          startSlot: 5,
          endSlot: 5,
          name: "Educación Física",
          link: "https://meet.google.com/anj-thus-pzc",
        },
        {
          day: 3,
          startSlot: 6,
          endSlot: 6,
          name: "Matemáticas",
          link: "https://meet.google.com/yzn-qgqp-jfd",
        },

        // JUEVES
        {
          day: 4,
          startSlot: 1,
          endSlot: 2,
          name: "Ciencias Sociales",
          link: "https://meet.google.com/xwf-mfgo-cri",
        },
        {
          day: 4,
          startSlot: 3,
          endSlot: 4,
          name: "Biología",
          link: "https://meet.google.com/twx-vnav-uyj",
        },
        {
          day: 4,
          startSlot: 5,
          endSlot: 6,
          name: "Educación Artística",
          link: "https://meet.google.com/okn-vgvd-wdn",
        },

        // VIERNES
        {
          day: 5,
          startSlot: 1,
          endSlot: 1,
          name: "Educación Ética",
          link: "https://meet.google.com/efd-vhwp-xfi",
        },
        {
          day: 5,
          startSlot: 2,
          endSlot: 3,
          name: "Emprendimiento",
          link: "https://meet.google.com/wou-hbtc-bjk",
        },
        {
          day: 5,
          startSlot: 4,
          endSlot: 4,
          name: "Lengua Castellana",
          link: "https://meet.google.com/wah-hoig-xhx",
          alternateLink: "https://meet.google.com/iec-uvas-vnx",
        },
        {
          day: 5,
          startSlot: 5,
          endSlot: 6,
          name: "Matemáticas",
          link: "https://meet.google.com/yzn-qgqp-jfd",
        },
      ];

      let currentDay = new Date().getDay();
      if (currentDay < 1 || currentDay > 5) currentDay = 1;
      const clockDisplay = document.getElementById("clockDisplay");
      const dayButtons = document.querySelectorAll(".day-btn");
      const selectedDayTitle = document.getElementById("selectedDayTitle");
      const timeline = document.getElementById("timeline");
      const themeToggleBtn = document.getElementById("themeToggleBtn");
      // Elementos de la tarjeta superior
      const liveTagText = document.getElementById("liveTagText");
      const liveClassTitle = document.getElementById("liveClassTitle");
      const liveCountdown = document.getElementById("liveCountdown");
      const liveEndText = document.getElementById("liveEndText");
      const progressBarFill = document.getElementById("progressBarFill");

      const dayNames = [
        "",
        "Lunes",
        "Martes",
        "Miércoles",
        "Jueves",
        "Viernes",
      ];

      function init() {
        setupEventListeners();
        selectDay(currentDay);
        updateClockAndLiveCard();
        setInterval(updateClockAndLiveCard, 1000);
      }

      function setupEventListeners() {
        dayButtons.forEach((btn) => {
          btn.addEventListener("click", () =>
            selectDay(parseInt(btn.getAttribute("data-day"))),
          );
        });

        themeToggleBtn.addEventListener("click", () => {
          document.body.classList.toggle("light-theme");
          themeToggleBtn.textContent = document.body.classList.contains(
            "light-theme",
          )
            ? "☀️"
            : "🌙";
        });
      }

      function selectDay(day) {
        currentDay = day;
        dayButtons.forEach((btn) => {
          btn.classList.toggle(
            "active",
            parseInt(btn.getAttribute("data-day")) === day,
          );
        });
        selectedDayTitle.textContent = `Horario del ${dayNames[day]}`;
        renderTimeline();
      }

      function launchClassLink(url) {
        if (url) window.open(url, "_blank");
      }

      function renderTimeline() {
        timeline.innerHTML = "";
        const now = new Date();
        const realDay = now.getDay();
        const currentMin = now.getHours() * 60 + now.getMinutes();
        const scheduleSlots = getScheduleSlotsForDay(currentDay);

        let skipSlotsCount = 0;

        scheduleSlots.forEach((slot) => {
          if (skipSlotsCount > 0) {
            skipSlotsCount--;
            return;
          }

          const slotDiv = document.createElement("div");
          slotDiv.className = "time-slot";

          const currentClass = classList.find(
            (c) => c.day === currentDay && c.startSlot === slot.id,
          );

          if (currentClass) {
            const startSlotObj = scheduleSlots.find(
              (s) => s.id === currentClass.startSlot,
            );
            const endSlotObj = scheduleSlots.find(
              (s) => s.id === currentClass.endSlot,
            );

            skipSlotsCount = currentClass.endSlot - currentClass.startSlot;

            if (
              realDay === currentDay &&
              currentMin >= startSlotObj.startMin &&
              currentMin < endSlotObj.endMin
            ) {
              slotDiv.classList.add("active-now");
            }

            const hourLabel =
              currentClass.startSlot === currentClass.endSlot
                ? `${startSlotObj.label}`
                : `${startSlotObj.label} a ${endSlotObj.label}`;

            slotDiv.innerHTML = `
            <div class="slot-header">
              <span>${hourLabel} (${startSlotObj.start} - ${endSlotObj.end})</span>
            </div>
            <div class="class-card">
              <div class="class-title">${currentClass.name}</div>
              ${
                currentClass.link
                  ? `
                <div class="class-links">
                  <button class="enter-class-btn">💻 Entrar a Clase Virtual</button>
                  ${currentClass.alternateLink ? `<button class="enter-class-btn alternate-link-btn">🔗 Enlace alternativo</button>` : ""}
                </div>
              `
                  : ""
              }
            </div>
          `;

            const primaryButton = slotDiv.querySelector(
              ".enter-class-btn:not(.alternate-link-btn)",
            );
            primaryButton?.addEventListener("click", (event) => {
              event.stopPropagation();
              launchClassLink(currentClass.link);
            });

            const alternateButton = slotDiv.querySelector(
              ".alternate-link-btn",
            );
            alternateButton?.addEventListener("click", (event) => {
              event.stopPropagation();
              launchClassLink(currentClass.alternateLink);
            });
          } else {
            slotDiv.innerHTML = `
            <div class="slot-header">
              <span>${slot.label} (${slot.start} - ${slot.end})</span>
            </div>
            <div class="empty-slot">Hora Libre</div>
          `;
          }

          timeline.appendChild(slotDiv);
        });
      }

      function updateClockAndLiveCard() {
        const now = new Date();
        const daysStr = [
          "Domingo",
          "Lunes",
          "Martes",
          "Miércoles",
          "Jueves",
          "Viernes",
          "Sábado",
        ];

        const dayName = daysStr[now.getDay()];
        const hours = now.getHours();
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();

        clockDisplay.textContent = `${dayName}, ${hours.toString().padStart(2, "0")}:${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;

        const today = now.getDay();
        const currentMin = hours * 60 + minutes;
        const currentSec = seconds;

        // 1. Fin de semana
        if (today === 0 || today === 6) {
          liveTagText.textContent = "FIN DE SEMANA";
          liveClassTitle.textContent = "Sin clases programadas";
          liveCountdown.textContent = "¡Disfruta tu descanso!";
          liveEndText.textContent = "";
          progressBarFill.style.width = "0%";
          return;
        }

        const scheduleSlotsForToday = getScheduleSlotsForDay(today);
        const activeSlot = scheduleSlotsForToday.find(
          (s) => currentMin >= s.startMin && currentMin < s.endMin,
        );

        // 2. Durante horario escolar (07:00 a 14:50)
        if (activeSlot) {
          const activeClass = classList.find(
            (c) =>
              c.day === today &&
              activeSlot.id >= c.startSlot &&
              activeSlot.id <= c.endSlot,
          );
          const endSlotObj = activeClass
            ? scheduleSlotsForToday.find((s) => s.id === activeClass.endSlot)
            : activeSlot;

          const totalSecondsInClass =
            (endSlotObj.endMin -
              (activeClass
                ? scheduleSlotsForToday.find(
                    (s) => s.id === activeClass.startSlot,
                  ).startMin
                : activeSlot.startMin)) *
            60;
          const elapsedSeconds =
            (currentMin -
              (activeClass
                ? scheduleSlotsForToday.find(
                    (s) => s.id === activeClass.startSlot,
                  ).startMin
                : activeSlot.startMin)) *
              60 +
            currentSec;
          const remainingSeconds = totalSecondsInClass - elapsedSeconds;

          const minLeft = Math.floor(remainingSeconds / 60);
          const secLeft = remainingSeconds % 60;

          const progressPercent = Math.min(
            100,
            Math.max(0, (elapsedSeconds / totalSecondsInClass) * 100),
          );
          progressBarFill.style.width = `${progressPercent}%`;

          liveEndText.textContent = `Termina a las ${endSlotObj.end}`;

          if (activeClass) {
            liveTagText.textContent = "CLASE EN VIVO";
            liveClassTitle.textContent = activeClass.name;
            liveCountdown.textContent = `Faltan ${minLeft}m ${secLeft.toString().padStart(2, "0")}s`;
          } else {
            liveTagText.textContent = "HORA LIBRE";
            liveClassTitle.textContent = "Sin materia asignada";
            liveCountdown.textContent = `Faltan ${minLeft}m ${secLeft.toString().padStart(2, "0")}s`;
          }
        }
        // 3. Fuera de las horas de clase principales (ej. Receso intermedio o antes/después)
        else {
          const nextSlot = scheduleSlotsForToday.find(
            (s) => s.startMin > currentMin,
          );

          if (nextSlot) {
            const firstSlotMin = scheduleSlotsForToday[0].startMin;

            // Si es antes de las 7:00 AM
            if (currentMin < firstSlotMin) {
              const nextClass = classList.find(
                (c) => c.day === today && c.startSlot === 1,
              );
              const minUntil = firstSlotMin - currentMin;
              liveTagText.textContent = "PRÓXIMA CLASE";
              liveClassTitle.textContent = nextClass
                ? nextClass.name
                : "Inicio de Jornada";
              liveCountdown.textContent = `Empieza en ${Math.floor(minUntil / 60)}h ${minUntil % 60}m`;
              liveEndText.textContent = `Inicia a las ${scheduleSlotsForToday[0].start}`;
              progressBarFill.style.width = "0%";
            }
            // Si es un descanso/receso entre clases (ej. 09:45 a 10:15)
            else {
              const nextClass = classList.find(
                (c) =>
                  c.day === today &&
                  nextSlot.id >= c.startSlot &&
                  nextSlot.id <= c.endSlot,
              );
              const minUntil = nextSlot.startMin - currentMin;
              liveTagText.textContent = "RECESO / DESCANSO";
              liveClassTitle.textContent = nextClass
                ? `Siguiente: ${nextClass.name}`
                : "Siguiente Hora";
              liveCountdown.textContent = `Reanuda en ${minUntil} min`;
              liveEndText.textContent = `Entrada a las ${nextSlot.start}`;
              progressBarFill.style.width = "100%";
            }
          }
          // Después de la 1:00 PM
          else {
            liveTagText.textContent = "JORNADA FINALIZADA";
            liveClassTitle.textContent = "¡Has terminado por hoy!";
            liveCountdown.textContent = "Nos vemos mañana";
            liveEndText.textContent = "";
            progressBarFill.style.width = "100%";
          }
        }
      }

      init();
    </script>
  </body>
</html>
